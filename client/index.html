    <meta name="google-adsense-account" content="ca-pub-1750461537555326" />
    <meta name="theme-color" content="#fbfbfc" />
    <script>
      (function () {
        var s = null;
        try { s = localStorage.getItem('devfeed-color-scheme'); } catch (e) {}
        var d = s === 'dark' || s === 'light' ? s : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-color-scheme', d);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', d === 'dark' ? '#0b0b0d' : '#fbfbfc');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
